<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
			}
			body {
				display: flex;
				flex-direction: column;
				padding: 64px 76px 52px;
				background: var(--background);
				color: var(--foreground);
				font-family: Inter;
			}
			header,
			footer {
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 14px;
				font-size: 28px;
				font-weight: 500;
				letter-spacing: -1px;
			}
			.brand img {
				width: 44px;
				height: 44px;
			}
			footer {
				font-size: 20px;
				font-weight: 400;
				color: var(--muted-foreground);
			}
			main {
				display: flex;
				flex-direction: column;
				margin-top: 76px;
			}
			h1 {
				margin: 0;
				font-size: 100px;
				line-height: 1.03;
				font-weight: 500;
				letter-spacing: -5px;
			}
			p {
				margin: 26px 0 0;
				font-size: 28px;
				line-height: 1.3;
				color: var(--muted-foreground);
			}
			footer {
				margin-top: auto;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="brand"><img src="brand" alt="" /><span>YAFFW</span></div>
		</header>
		<main>
			<h1>Edit video in<br />your browser.</h1>
			<p>No uploads. No account.</p>
		</main>
		<footer><span>Select. Mix. Export.</span></footer>
	</body>
</html>

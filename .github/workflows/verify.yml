name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency-cache:
        type: choice
        options: [store, modules, cold]
        default: store
      checkout:
        type: choice
        options: [shallow, blobless]
        default: shallow
      runner-image:
        type: choice
        options: [host, playwright]
        default: host
      cache-salt:
        type: string
        default: v1

permissions:
  contents: read
  actions: read

concurrency:
  # Master runs must all finish; even pending integrations need unique groups.
  group: verify-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DEPENDENCY_CACHE_MODE: ${{ inputs.dependency-cache || 'store' }}
  CACHE_SALT: ${{ inputs.cache-salt || 'v1' }}
  CI_RUNNER_IMAGE: ${{ inputs.runner-image || 'host' }}
  YAFFW_TEST_SEED: ${{ github.run_id }}
  HUSKY: 0

jobs:
  editor:
    name: Editor verification
    runs-on: ubuntu-latest
    container: ${{ inputs.runner-image == 'playwright' && 'mcr.microsoft.com/playwright:v1.65.0-noble' || '' }}
    timeout-minutes: 15
    outputs:
      release-digest: ${{ steps.release.outputs.sha256 }}
    steps:
      - name: Record setup start
        run: echo "CI_SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          filter: ${{ inputs.checkout == 'blobless' && 'blob:none' || '' }}
          fetch-depth: 1
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          lane: editor
          runner-image: ${{ inputs.runner-image || 'host' }}
      - name: Complete editor contract
        id: contract
        run: node scripts/verify.mjs --ci-lane editor
      - name: Upload complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-evidence-editor-${{ github.run_id }}
          path: tmp/verify-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Package immutable editor candidate outputs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: release
        run: node scripts/create-release.mjs '${{ steps.contract.outputs.evidence }}'
      - name: Retain immutable editor candidate outputs
        if: success() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-editor-${{ github.run_id }}
          path: ${{ steps.release.outputs.directory }}
          if-no-files-found: error
          retention-days: 1

  landing:
    name: Landing verification
    runs-on: ubuntu-latest
    container: ${{ inputs.runner-image == 'playwright' && 'mcr.microsoft.com/playwright:v1.65.0-noble' || '' }}
    timeout-minutes: 15
    outputs:
      release-digest: ${{ steps.release.outputs.sha256 }}
    steps:
      - name: Record setup start
        run: echo "CI_SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          filter: ${{ inputs.checkout == 'blobless' && 'blob:none' || '' }}
          fetch-depth: 1
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          lane: landing
          runner-image: ${{ inputs.runner-image || 'host' }}
      - name: Complete landing contract
        id: contract
        run: node scripts/verify.mjs --ci-lane landing
      - name: Upload complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-evidence-landing-${{ github.run_id }}
          path: tmp/verify-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Package immutable landing candidate outputs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: release
        run: node scripts/create-release.mjs '${{ steps.contract.outputs.evidence }}'
      - name: Retain immutable landing candidate outputs
        if: success() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-landing-${{ github.run_id }}
          path: ${{ steps.release.outputs.directory }}
          if-no-files-found: error
          retention-days: 1
      - name: Require the editor peer before seeding shared caches
        if: success() && github.ref == 'refs/heads/master' && env.DEPENDENCY_CACHE_MODE != 'cold'
        id: peer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-editor.mjs '${{ steps.contract.outputs.evidence }}'
      - name: Save dependencies from verified master only
        if: success() && steps.peer.outputs.verified == 'true' && github.ref == 'refs/heads/master' && env.DEPENDENCY_CACHE_MODE != 'cold' && steps.setup.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.setup.outputs.dependency-path }}
          key: ${{ steps.setup.outputs.dependency-key }}
      - name: Save Chromium from verified master only
        if: success() && steps.peer.outputs.verified == 'true' && github.ref == 'refs/heads/master' && env.DEPENDENCY_CACHE_MODE != 'cold' && inputs.runner-image != 'playwright' && steps.setup.outputs.browser-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.setup.outputs.browser-key }}
      - name: Save image transforms from verified master only
        if: success() && steps.peer.outputs.verified == 'true' && github.ref == 'refs/heads/master' && env.DEPENDENCY_CACHE_MODE != 'cold' && steps.setup.outputs.images-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: landing/node_modules/.astro/assets
          key: ${{ steps.setup.outputs.image-key }}

  verify:
    name: verify
    if: always()
    needs: [editor, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Require both complete contracts
        env:
          EDITOR_RESULT: ${{ needs.editor.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
        run: |
          printf 'Editor: %s\nLanding: %s\n' "$EDITOR_RESULT" "$LANDING_RESULT"
          test "$EDITOR_RESULT" = success
          test "$LANDING_RESULT" = success

  deploy:
    # Enable only after both independent Workers Builds connections are disabled
    # and scoped production credentials are configured. Disabled means SKIPPED.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.YAFFW_GATED_DEPLOYMENT == 'enabled'
    needs: [verify, editor, landing]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      HUSKY: 0
      EXPECTED_EDITOR_DIGEST: ${{ needs.editor.outputs.release-digest }}
      EXPECTED_LANDING_DIGEST: ${{ needs.landing.outputs.release-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-editor-${{ github.run_id }}
          path: verified/editor
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-landing-${{ github.run_id }}
          path: verified/landing
      - name: Require the verified revision and artifact
        run: node scripts/validate-release.mjs
      - name: Deploy exactly the verified assets (no rebuild)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy --config release/wrangler.jsonc
          pnpm exec wrangler deploy --config release/landing/wrangler.jsonc

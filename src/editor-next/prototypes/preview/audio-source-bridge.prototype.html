<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PROTOTYPE - Audio Source Bridge</title>
		<style>
			body {
				background: #101318;
				color: #e8edf2;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
				margin: 0;
				padding: 24px;
			}

			main {
				display: grid;
				gap: 16px;
				max-width: 1100px;
			}

			button,
			input,
			select {
				font: inherit;
			}

			button {
				background: #e8edf2;
				border: 0;
				border-radius: 4px;
				color: #101318;
				cursor: pointer;
				font-weight: 700;
				padding: 8px 12px;
			}

			select {
				background: #07090c;
				border: 1px solid #303844;
				border-radius: 4px;
				color: #e8edf2;
				padding: 7px 10px;
			}

			button:disabled {
				cursor: not-allowed;
				opacity: 0.45;
			}

			.track,
			.mixdown {
				border: 1px solid #303844;
				border-radius: 6px;
				display: grid;
				gap: 10px;
				padding: 12px;
			}

			.controls,
			.mixdown-row {
				align-items: center;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}

			.debug-header {
				align-items: center;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}

			.debug-header h2 {
				margin: 0;
			}

			.status {
				color: #aab4c0;
				font-size: 0.88rem;
			}

			.control {
				align-items: center;
				display: inline-flex;
				gap: 6px;
			}

			.control span {
				color: #aab4c0;
				font-size: 0.88rem;
			}

			.derived-source {
				background: #151a21;
				border: 1px solid #303844;
				border-radius: 4px;
				display: grid;
				gap: 8px;
				padding: 10px;
			}

			.derived-source h3 {
				margin: 0;
			}

			.mixdown-list {
				display: grid;
				gap: 8px;
			}

			.mixdown-row {
				border-top: 1px solid #303844;
				padding-top: 8px;
			}

			audio {
				width: 100%;
			}

			pre {
				background: #07090c;
				border: 1px solid #303844;
				border-radius: 6px;
				max-height: 420px;
				overflow: auto;
				padding: 12px;
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>PROTOTYPE - Audio Source Bridge</h1>
			<p>
				Question: can each embedded audio track become a separate
				browser-playable source, repair one-sided stereo captures, be re-encoded
				to mono when needed, and be merged into one playable mixdown source?
			</p>
			<input id="file" type="file" accept="audio/*,video/*" />
			<div>
				<button id="prepare" disabled>Prepare audio sources</button>
				<button id="play-all" disabled>Play all prepared tracks</button>
				<button id="stop-all" disabled>Stop all</button>
			</div>
			<div class="controls">
				<label class="control">
					<span>Final peak guard</span>
					<select id="peak-ceiling">
						<option value="0">0 dBFS</option>
						<option value="-1" selected>-1 dBFS</option>
						<option value="-3">-3 dBFS</option>
						<option value="-6">-6 dBFS</option>
						<option value="-9">-9 dBFS</option>
						<option value="-12">-12 dBFS</option>
					</select>
				</label>
			</div>
			<section id="tracks"></section>
			<section id="mixdown"></section>
			<div class="debug-header">
				<h2>Debug state</h2>
				<button id="copy-state">Copy JSON</button>
				<span id="copy-state-status" class="status"></span>
			</div>
			<pre id="state"></pre>
		</main>
		<script type="module" src="./audio-source-bridge.prototype"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Issue 105 mixed-audio export investigation</title>
	</head>
	<body>
		<main>
			<h1>Issue 105 mixed-audio export investigation</h1>
			<pre id="report">Running real Chromium/WebCodecs comparison…</pre>
		</main>
		<script type="module">
			import { runSinglePassMixedAudioExportInvestigation } from "./single-pass-mixed-audio-export-investigation";

			const reportElement = document.querySelector("#report");

			try {
				const report = await runSinglePassMixedAudioExportInvestigation();
				reportElement.textContent = JSON.stringify(report, null, 2);
			} catch (error) {
				reportElement.textContent = JSON.stringify(
					{
						message: error instanceof Error ? error.message : String(error),
						name: error instanceof Error ? error.name : "UnknownError",
					},
					null,
					2,
				);
			}
		</script>
	</body>
</html>
